<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argus Safety - Case Management</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top branding banner -->
  <header class="app-banner">
    <div class="brand">
      <span class="brand-mark">O</span>
      <span class="brand-name">Oracle Argus Safety</span>
      <span class="brand-sub">8.4</span>
    </div>
    <div class="banner-right">
      <span class="env-pill">TRAINING</span>
      <span class="user-info">User: <strong>pv.trainee</strong> &nbsp;|&nbsp; Site: TRAINING &nbsp;|&nbsp; Group: Data Entry</span>
    </div>
  </header>

  <!-- Menu bar (dropdowns rendered by app.js) -->
  <nav id="menubar" class="menubar" aria-label="Main menu"></nav>

  <!-- Main application surface -->
  <main id="view" class="view"></main>

  <!-- Toast / status area -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
